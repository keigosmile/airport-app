# 空港制覇 ビルド設定（Codemagic）※おかきバトルの設定を流用
# iOS: ビルドしてTestFlightへ自動送信 / Android: テスト用APKを作成
# 「build」ブランチに送ったときだけ、iOS版をビルドする（mainでは自動ビルドしない）
workflows:
  ios-testflight:
    name: iOS（TestFlightへ送る）
    instance_type: mac_mini_m2
    max_build_duration: 60
    # mainへの変更では自動ビルドしない（無料の月500分を節約するため）
    # 「build」ブランチにmainの内容を送ったときだけビルドしてTestFlightに届ける
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: build
          include: true
      cancel_previous_builds: true
    integrations:
      app_store_connect: okaki        # TestFlightへの送信に使うAPIキー
    environment:
      groups:
        - apple_signing               # APP_STORE_CONNECT_PRIVATE_KEY / CERT_P12_BASE64 / CERT_P12_PASSWORD（Codemagicの画面で登録）
      vars:
        BUNDLE_ID: com.keigosmile.kuukouseiha
        APP_STORE_CONNECT_ISSUER_ID: fbde59a9-f3b7-4e5a-a5a2-c13076e4badb
        APP_STORE_CONNECT_KEY_IDENTIFIER: 5ARKDPU8D2
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: 部品をインストール
        script: npm install
      - name: iOSプロジェクトを生成（アイコン込み）
        script: npm run ios:prepare
      - name: 対応iOSを15.0以上・iPhone専用にする
        script: |
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/App/App.xcodeproj/project.pbxproj
          # iPhone専用にする（iPad用のスクリーンショットを不要にする）
          sed -i '' 's/TARGETED_DEVICE_FAMILY = "1,2";/TARGETED_DEVICE_FAMILY = 1;/g' ios/App/App.xcodeproj/project.pbxproj
          grep -n "TARGETED_DEVICE_FAMILY" ios/App/App.xcodeproj/project.pbxproj || true
          if [ -f ios/App/Podfile ]; then
            sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '15.0'/" ios/App/Podfile
            cd ios/App && pod install
          fi
      - name: 輸出規制の質問をスキップ（暗号化なし）
        script: /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist
      - name: 署名の準備（Appleから証明書とプロファイルを取得）
        script: |
          set -e
          echo "$CERT_P12_BASE64" | base64 --decode > /tmp/dist.p12
          KEY=""
          for OSSL in /opt/homebrew/opt/openssl@3/bin/openssl /usr/local/opt/openssl@3/bin/openssl openssl; do
            command -v "$OSSL" >/dev/null 2>&1 || [ -x "$OSSL" ] || continue
            KEY=$("$OSSL" pkcs12 -in /tmp/dist.p12 -nocerts -nodes -passin "pass:$CERT_P12_PASSWORD" 2>/dev/null | "$OSSL" pkey 2>/dev/null) && [ -n "$KEY" ] && break
            KEY=$("$OSSL" pkcs12 -legacy -in /tmp/dist.p12 -nocerts -nodes -passin "pass:$CERT_P12_PASSWORD" 2>/dev/null | "$OSSL" pkey 2>/dev/null) && [ -n "$KEY" ] && break
            KEY=""
          done
          if [ -z "$KEY" ]; then echo "証明書(.p12)から鍵を取り出せませんでした。CERT_P12_BASE64 と CERT_P12_PASSWORD を確認してください"; exit 1; fi
          export CERTIFICATE_PRIVATE_KEY="$KEY"
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --certificate-key=@env:CERTIFICATE_PRIVATE_KEY --create
          keychain add-certificates
          xcode-project use-profiles
          rm -f /tmp/dist.p12
      - name: ビルド番号を自動で上げる（Codemagicの通し番号を使う）
        script: cd ios/App && agvtool new-version -all $BUILD_NUMBER
      - name: アプリを組み立てる
        script: xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false     # 内部テスト（自分のiPhone）には審査不要。外部テストを始める時にtrueにする

  android-apk:
    name: Android（テスト用APK）
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      java: 21
    scripts:
      - name: 部品をインストール
        script: npm install
      - name: Androidプロジェクトを生成（アイコン込み）
        script: npm run android:prepare
      - name: APKを組み立てる
        script: cd android && ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/**/*.apk
